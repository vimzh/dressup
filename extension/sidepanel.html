<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --raised: #faf9fc;
    --line: #ebe8f0;
    --ink: #1b1820;
    --dim: #6b6577;
    --faint: #9a94a6;
    --accent: #7c3aed;
    --accent-soft: #f2eefe;
    --danger: #b4232a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131118; --raised: #1c1a24; --line: #2b2833;
      --ink: #f2f0f6; --dim: #a29cb0; --faint: #6f6880;
      --accent: #a78bfa; --accent-soft: #241d38;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    margin: 0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* ---------------------------------------------------------------- chrome */

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 15px 0;
  }

  header h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  header img { width: 18px; height: 18px; border-radius: 5px; }

  .tabs {
    flex: none;
    display: flex;
    gap: 2px;
    padding: 11px 12px 0;
    border-bottom: 1px solid var(--line);
  }

  .tab {
    padding: 7px 12px 9px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--dim);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge {
    margin-left: 5px; padding: 1px 6px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 10.5px; font-weight: 700;
  }

  main { flex: 1; overflow-y: auto; padding: 15px; }
  [hidden] { display: none !important; }

  h2 {
    margin: 0 0 9px;
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--faint);
  }

  section + section { margin-top: 22px; }

  /* ---------------------------------------------------------------- inputs */

  button.primary {
    width: 100%; padding: 9px; border: 0; border-radius: 9px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 650; cursor: pointer;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.primary:disabled { opacity: .45; cursor: default; }

  button.ghost {
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer;
  }
  button.ghost:hover { background: var(--raised); }

  button.link {
    padding: 0; border: 0; background: none; color: var(--faint);
    font: inherit; font-size: 11px; cursor: pointer;
  }
  button.link:hover { color: var(--danger); }

  input[type="text"] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  input[type="file"] { display: none; }

  .row { display: flex; gap: 7px; align-items: center; }

  /* ------------------------------------------------------------- try-on tab */

  .photo {
    display: flex; align-items: center; justify-content: center;
    width: 100%; aspect-ratio: 3/4; max-height: 210px; margin-bottom: 10px;
    border: 1.5px dashed var(--line); border-radius: 12px;
    background: var(--raised); overflow: hidden; cursor: pointer;
  }
  .photo:hover { border-color: var(--accent); }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo .ph { text-align: center; padding: 0 20px; color: var(--dim); }
  .photo .ph .ic { font-size: 24px; }
  .photo .ph p { margin: 6px 0 0; font-size: 12px; }

  .status { margin: 9px 0 0; font-size: 12px; text-align: center; min-height: 16px; color: var(--dim); }
  .status.ok { color: #16794b; }
  .status.err { color: var(--danger); }
  .status.warn { color: #8a5a00; }

  .strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .strip img {
    width: 46px; height: 60px; object-fit: cover;
    border-radius: 7px; border: 1px solid var(--line); background: var(--raised);
  }

  .empty {
    padding: 26px 16px; border: 1px dashed var(--line); border-radius: 11px;
    text-align: center; color: var(--dim); font-size: 12px; line-height: 1.55;
  }

  /* -------------------------------------------------------------- saved tab */

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 13px; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg); color: var(--dim);
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .7; font-weight: 500; }

  .looks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .look {
    position: relative; border: 1px solid var(--line); border-radius: 11px;
    overflow: hidden; background: var(--raised);
  }
  .look img { display: block; width: 100%; aspect-ratio: 3/4; object-fit: cover; }
  .look .cap { padding: 7px 8px; }
  .look .cap b { display: block; font-size: 11.5px; font-weight: 650; line-height: 1.35; }
  .look .cap span { display: block; margin-top: 2px; font-size: 10.5px; color: var(--faint); }

  .look .del {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
    background: rgba(20,18,28,.72); color: #fff; font-size: 14px; line-height: 1;
    cursor: pointer; opacity: 0; transition: opacity .15s ease;
  }
  .look:hover .del { opacity: 1; }
  .look .del:hover { background: var(--danger); }

  .look .kind {
    position: absolute; top: 6px; left: 6px;
    padding: 2px 7px; border-radius: 999px;
    background: rgba(20,18,28,.72); color: #fff; font-size: 9.5px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
  }

  footer {
    flex: none; padding: 10px 15px; border-top: 1px solid var(--line);
    font-size: 11px; line-height: 1.45; color: var(--faint);
  }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>DressUp</h1>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabTry" role="tab" aria-selected="true" aria-controls="paneTry">
      Try on<span class="badge" id="selCount" hidden></span>
    </button>
    <button class="tab" id="tabSaved" role="tab" aria-selected="false" aria-controls="paneSaved">
      Saved<span class="badge" id="lookCount" hidden></span>
    </button>
  </div>

  <main>
    <!-- ------------------------------------------------------- try-on pane -->
    <div id="paneTry" role="tabpanel">
      <section>
        <h2>Your photo</h2>
        <label class="photo" for="file">
          <div class="ph" id="ph">
            <div class="ic">📸</div>
            <p>Click to add a photo<br>Full body, facing forward</p>
          </div>
          <img id="preview" hidden alt="Your photo">
        </label>
        <input type="file" id="file" accept="image/*">
        <button class="ghost" id="replace" hidden style="width:100%">Replace photo</button>
        <p class="status" id="photoStatus"></p>
      </section>

      <section>
        <h2>Current fit</h2>
        <div id="fitEmpty" class="empty">
          Tick items as you browse to build a fit, then try them on together.
        </div>
        <div id="fitBody" hidden>
          <div class="strip" id="strip"></div>
          <button class="primary" id="tryfit">Try this fit</button>
          <div class="row" style="margin-top:8px;justify-content:center">
            <button class="link" id="clearFit">Clear selection</button>
          </div>
        </div>
        <p class="status" id="fitStatus"></p>
      </section>
    </div>

    <!-- -------------------------------------------------------- saved pane -->
    <div id="paneSaved" role="tabpanel" hidden>
      <section>
        <h2>Collections</h2>
        <div class="chips" id="chips"></div>
        <div class="row">
          <input type="text" id="newCollection" placeholder="New collection…" maxlength="60">
          <button class="ghost" id="addCollection">Add</button>
        </div>
      </section>

      <section>
        <h2 id="looksHeading">Saved looks</h2>
        <div id="looksEmpty" class="empty">
          Nothing saved yet. Try something on, then hit <strong>Save</strong> on the result.
        </div>
        <div class="looks" id="looks"></div>
      </section>
    </div>
  </main>

  <footer id="foot">Renders are stored by your local DressUp server.</footer>

  <script src="sidepanel.js"></script>
</body>
</html>
